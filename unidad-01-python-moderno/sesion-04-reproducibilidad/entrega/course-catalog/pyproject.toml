[project]
name = "course-catalog-mcp"
version = "0.1.0"
description = "Search a local course catalog through Python and MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
